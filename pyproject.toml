[project]
name = "tender-parser"
version = "1.0.0"
description = "Offline tender/NIT PDF extraction — FastAPI + Streamlit"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20231228",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "regex>=2023.12.25",
]

[tool.vercel]
entrypoint = "app.api.main:app"
